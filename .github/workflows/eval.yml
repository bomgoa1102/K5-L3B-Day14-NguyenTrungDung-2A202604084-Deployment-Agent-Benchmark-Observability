name: Eval quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start agent and evaluate
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 python app.py > /tmp/day14-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              break
            fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              cat /tmp/day14-agent.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health > /dev/null
          python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85
